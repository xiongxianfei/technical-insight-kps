name: Validate Technical Insight KPS
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate publication
        run: python3 validate.py .
      - name: Run core regression tests
        run: python3 test_validate.py
      - name: Verify synthetic example calculations
        run: python3 test_examples.py
      - name: Check complete Method transition and synthetic technique arithmetic
        run: python3 test_transition.py
